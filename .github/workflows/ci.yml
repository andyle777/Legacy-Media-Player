name: Windows build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore LegacyMediaPlayer.sln
      - name: Build
        run: dotnet build LegacyMediaPlayer.sln -c Release --no-restore
      - name: Managed behavior tests
        run: dotnet test LegacyMediaPlayer.sln -c Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Native decoder smoke tests
        run: dotnet test tests/LegacyMediaPlayer.NativeTests -c Release --logger "trx;LogFileName=native.trx" --results-directory TestResults --blame-hang-timeout 90s
      - name: Package preflight regression
        shell: pwsh
        run: ./scripts/tests/Test-PackagePreflight.ps1
      - name: Windows native architecture selection
        shell: pwsh
        run: ./scripts/tests/Test-WindowsVlcArchitecture.ps1
      - name: Publish and verify versioned Windows x64 ZIP
        shell: pwsh
        run: ./scripts/Package-Windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
      - uses: actions/upload-artifact@v4
        with:
          name: LegacyMediaPlayer-win-x64
          path: |
            artifacts/LegacyMediaPlayer-v*.zip
            artifacts/LegacyMediaPlayer-v*.zip.sha256
          if-no-files-found: error
